<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EURUSD Session Research Lab -- Replay Trainer</title>
<link rel="stylesheet" href="style.css">
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script>
/* THEME (same pattern as design/preview.html / label_validate.py's review page) -- runs before
   app.js so #darkToggle's initial checked state (and the chart's own initColors) already match
   whatever was stored last time, instead of flashing dark-then-light. */
(function(){
  var root = document.documentElement;
  function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  window.__safeSetTheme = function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} };
  var stored = safeGet('eurusd-theme');
  if(stored === 'light' || stored === 'dark'){ root.setAttribute('data-theme', stored); }
  window.__currentTheme = function(){
    var a = root.getAttribute('data-theme');
    if(a) return a;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  };
})();
</script>
</head>
<body class="elev-flat">
<div id="overlayDim"></div>
<header id="topbar" class="elev-flat">
  <div class="group">
    <button id="navToggle" class="press drawerBtn" title="Days &amp; filters" aria-label="Open day navigator">
      <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
    </button>
    <input type="date" id="datePicker">
    <button id="prevDay" class="press" title="Previous filtered day">&#9664; prev</button>
    <button id="nextDay" class="press" title="Next filtered day">next &#9654;</button>
    <button id="randomDay" class="press" title="Random filtered day">&#127922; random</button>
  </div>
  <div class="group">
    <label>Start at</label>
    <select id="startAt">
      <option value="-7">17:00 prev (full context)</option>
      <option value="2">02:00 (London open)</option>
      <option value="7" selected>07:00 (NY AM open)</option>
      <option value="9.5">09:30 (NY cash open)</option>
    </select>
  </div>
  <div class="group">
    <label>TF</label>
    <select id="tf">
      <option>M5</option><option>M15</option><option>H1</option><option>H4</option><option>D1</option>
    </select>
  </div>
  <div class="group">
    <label><input type="checkbox" id="blindMode"> Blind mode</label>
    <label class="switch">Dark
      <input type="checkbox" id="darkToggle" checked>
      <span class="track"></span>
    </label>
  </div>
  <button id="acctToggle" class="press drawerBtn" title="Account &amp; ticket" aria-label="Open account panel">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
  </button>
</header>

<div id="sheetTabs" class="press-group">
  <button id="tabDays" class="press active">Days</button>
  <button id="tabAccount" class="press">Account</button>
</div>
<div id="layout">
  <aside id="navigator" class="elev-flat">
    <div id="filters">
      <h3>Filters <span id="matchCount" class="muted"></span></h3>
      <label>From <input type="date" id="fFrom"></label>
      <label>To <input type="date" id="fTo"></label>
      <div id="fWeekdays">
        <label><input type="checkbox" value="0" checked>Mon</label>
        <label><input type="checkbox" value="1" checked>Tue</label>
        <label><input type="checkbox" value="2" checked>Wed</label>
        <label><input type="checkbox" value="3" checked>Thu</label>
        <label><input type="checkbox" value="4" checked>Fri</label>
      </div>
      <label><input type="checkbox" id="fExcludeThin" checked> Exclude thin/holiday days</label>
      <label><input type="checkbox" id="fLonHigh"> London high raided in NY</label>
      <label><input type="checkbox" id="fLonLow"> London low raided in NY</label>
      <div class="presetRow">
        <select id="presetSelect"><option value="">-- load preset --</option></select>
        <button id="savePreset" class="press">save current as preset</button>
      </div>
    </div>
    <div id="dayTableWrap" class="elev-inset">
      <table id="dayTable">
        <thead><tr><th>Date</th><th>Day</th><th>NY rng</th><th>Lon rng</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </aside>

  <main id="chartArea" class="elev-flat">
    <div id="chart"></div>
    <div id="playbar" class="elev-flat">
      <button id="stepBack" class="press" title="Step back (review mode only)">&#9664;1</button>
      <button id="stepFwd" class="press" title="Reveal next bar">1&#9654;</button>
      <button id="stepHour" class="press">+1h</button>
      <button id="playPause" class="press">&#9654; play</button>
      <select id="speed"><option value="1000">1/s</option><option value="500">2/s</option><option value="200">5/s</option><option value="50">20/s</option></select>
      <input type="time" id="jumpTime" step="60">
      <button id="jumpBtn" class="press">jump</button>
      <span id="clockLabel" class="muted tabular"></span>
    </div>
  </main>

  <aside id="accountPanel" class="elev-flat">
    <h3>Maven account</h3>
    <div id="acctSummary" class="elev-raised-soft" style="padding:10px 12px;border-radius:var(--radius-card)"></div>
    <hr>
    <h3>Order ticket</h3>
    <div id="ticket">
      <label>Side
        <select id="side"><option value="long">BUY</option><option value="short">SELL</option></select>
      </label>
      <label>Order type
        <select id="orderType">
          <option value="market">Market (fill now)</option>
          <option value="limit">Limit (rests below/above)</option>
          <option value="stop">Stop (rests below/above)</option>
        </select>
      </label>
      <label id="entryRow" style="display:none">Entry price <input type="number" id="entryInput" step="0.00001"></label>
      <label class="row-with-tip">Risk %
        <button type="button" class="info-icon" data-tip="How much of your account balance this trade risks if the stop loss is hit. Position size (lots) is calculated backwards from this.">i</button>
        <input type="number" id="riskPct" value="0.5" step="0.1" min="0.1" style="width:100%">
      </label>
      <label>SL <input type="number" id="slInput" step="0.00001"></label>
      <label>TP <input type="number" id="tpInput" step="0.00001"></label>
      <div class="row-with-tip">
        <div id="lotsPreview" class="muted tabular"></div>
        <button type="button" class="info-icon" data-tip="Lot size the risk % and SL distance above imply -- this is a preview, not yet an order. It updates as you move the SL line.">i</button>
      </div>
      <button id="openTradeBtn" class="press">Place order</button>
      <button id="cancelPendingBtn" class="press" disabled>Cancel pending order</button>
      <button id="closeTradeBtn" class="press" disabled>Close trade</button>
      <button id="partialCloseBtn" class="press" disabled title="Close half the position at market, keep the rest running">Partial close 50%</button>
      <button id="moveBEBtn" class="press" disabled title="Move stop loss to entry price">Move SL to breakeven</button>
      <p class="muted" style="margin:4px 0 0">Drag the SL/TP lines on the chart to adjust them.</p>
    </div>
    <div id="pendingInfo" class="muted"></div>
    <div id="openTradeInfo"></div>
    <hr>
    <h3>Journal (last trade)</h3>
    <div id="journalForm">
      <label>Setup tag <input type="text" id="setupTag" placeholder="london_sweep_reversal"></label>
      <label>Rules followed?
        <select id="rulesFollowed"><option value="Y">Y</option><option value="N">N</option></select>
      </label>
      <label>Emotion (1-5) <input type="number" id="emotion" min="1" max="5" value="3"></label>
      <label>Notes <textarea id="notes" rows="2"></textarea></label>
      <button id="saveJournalBtn" class="press" disabled>Save to journal + screenshot</button>
    </div>
    <p class="muted footnote">Not financial advice. Practice tool only -- read-only against MT5.</p>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>
