# See silver_bullet_fvg_lonsb.yaml for the full rule description and why `window` is wider than
# `kz_window` -- identical rules here, NY AM window.
name: silver_bullet_fvg_nyamsb
version: "1.0"
description: "Silver Bullet (NY AM): same rules as silver_bullet_fvg_lonsb, run in the nyam_sb killzone."
params:
  kz_window: [10.0, 12.0]   # nyam_sb, config/windows.yaml
  window: [10.0, 15.0]   # kz_hi(12.0) + mss_max_bars(2h) + entry_max_bars_after_mss(1h) = 15.0
  entry_max_bars_after_mss: 12
  stop_buffer_pips: 1.0
  rr: 2.0
  time_exit: 16.0
