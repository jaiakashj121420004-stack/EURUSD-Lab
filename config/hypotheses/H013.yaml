id: H013
version: '1.1'
title: ADR used by 09:30 > 80% -> NY range below its median
decision_time_h: 9.5
condition: adr_used_0930 > 0.8
outcome: r0930_1600 < median(r0930_1600)
baseline: r0930_1600 < median(r0930_1600)
notes: >-
  v1.0 (ported verbatim from v0/nylab.hypotheses H013) used `ny_range` (07:00-16:00) as its
  outcome even though decision_time_h=9.5 -- the 2026-09-26 review found this meant a big
  07:00-09:30 move (the SAME move `condition` reads via adr_used_0930) made both condition and
  outcome true by construction (RESEARCH_PROTOCOL.md S3). Measured with the outcome restricted
  to 09:30-16:00: IS +6pp p=0.06, OOS +2pp p=0.67, median 43 vs 41 pips -- the effect vanished.
  v1.1 swaps in `r0930_1600` (ROADMAP 5.7.2's new post-09:30 outcome column, added specifically
  for this fix) so the outcome only measures price action a trader could not have already
  priced in when the decision was made. v1.0's ledger rows (research/ledger.csv) are untouched
  -- this is a NEW (id, version) pair, m += 1, not a rewrite of history.

  ROADMAP 5.7.4 direction note (2026-09-27, re-run against the real 5-yr cache with the fully
  fixed 5.7.3 engine): docs/JEV_INTEGRATION.md S6.1 flagged this title as pointing the WRONG way
  under v0's buggy pipeline -- the theory being volatility clustering (a busy pre-NY session is
  followed by a busy, not quiet, NY session), and asked for "correctly-directed titles" once the
  engine was fixed. Measured properly (IS-only p, complement baseline, 5-td embargo): n=540,
  is_hit=0.462 vs baseline=0.478, p=0.63, verdict noise, direction=opposite (i.e. this run's IS
  data leans the volatility-clustering way, condition days are LESS often below-median, matching
  S6.1's theory) -- but p=0.63 means that lean is indistinguishable from chance on this data. Left
  the title/outcome operator AS-IS rather than flipping to match this run's (non-significant)
  sign: flipping a title to chase one run's noise would be the same mistake in the other
  direction. The `direction` field (opposite/as_claimed, computed fresh every run) is the honest,
  non-stale record of which way the data leans -- see that column in hypotheses.csv rather than
  trusting this title's wording either way. Flagged for Akash: if he'd rather the title itself be
  reworded to state the volatility-clustering direction regardless of significance, that's a
  one-line change (title + outcome operator flip), his call.
